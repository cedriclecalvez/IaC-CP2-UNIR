all:
  children:
    acr:
      hosts:
        acr-server:
          ansible_host: "{{ lookup('community.general.terraform', 'acr_login_server') }}"
          acr_username: "{{ lookup('community.general.terraform', 'acr_username') }}"
          acr_password: "{{ lookup('community.general.terraform', 'acr_password') }}"
          acr_name: "{{ lookup('community.general.terraform', 'acr_name') }}"
    vm:
      hosts:
        vm-server:
          ansible_host: "{{ lookup('community.general.terraform', 'vm_public_ip_addresses') }}"
          ansible_user: "adminuser"
          # ansible_ssh_private_key_file: "~/.ssh/id_rsa"
          ansible_ssh_private_key_file: "/tmp/terraform_vm_key.pem"
          vm_id: "{{ lookup('community.general.terraform', 'vm_ids') }}"
          vm_principal_id: "{{ lookup('community.general.terraform', 'vm_principal_id') }}"

    aks:
      hosts:
        aks-server:
          ansible_host: "{{ lookup('community.general.terraform', 'aks_cluster_name') }}"
          aks_kube_config: "{{ lookup('community.general.terraform', 'aks_kube_config') }}"
          aks_node_resource_group: "{{ lookup('community.general.terraform', 'aks_node_resource_group') }}"
          aks_principal_id: "{{ lookup('community.general.terraform', 'aks_principal_id') }}"
