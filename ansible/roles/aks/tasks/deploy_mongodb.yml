- name: Create MongoDB deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mongodb-cp2-unir
        namespace: my-aks-unir
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mongodb-unir
        template:
          metadata:
            labels:
              app: mongodb-unir
          spec:
            
            containers:
              - name: mongodb-container-unir
                image: "{{ acr_login_server }}/casopractico2/mongodb:latest"
                ports:
                  - containerPort: 27017
                env:
                  - name: MONGO_INITDB_ROOT_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: mongodb-secret-unir
                        key: MONGO_INITDB_ROOT_USERNAME
                  - name: MONGO_INITDB_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mongodb-secret-unir
                        key: MONGO_INITDB_ROOT_PASSWORD
                volumeMounts:
                  - mountPath: /data/db
                    name: mongodb-storage-unir
            restartPolicy: Always 
            volumes:
              - name: mongodb-storage-unir
                persistentVolumeClaim:
                  claimName: my-pvc-cp2
                  # claimName: mongodb-pvc-unir

