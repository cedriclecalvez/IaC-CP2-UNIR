- name: Create MongoDB service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mongodb
        namespace: my-aks-unir
      spec:
        ports:
          - port: 27017
        selector:
          app: mongodb

- name: Create MongoDB deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mongodb
        namespace: my-aks-unir
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mongodb
        template:
          metadata:
            labels:
              app: mongodb
          spec:
            containers:
              - name: mongodb
                image: mongo:latest
                ports:
                  - containerPort: 27017
                volumeMounts:
                  - mountPath: /data/db
                    name: mongodb-storage
            volumes:
              - name: mongodb-storage
                persistentVolumeClaim:
                  claimName: mongodb-pvc
