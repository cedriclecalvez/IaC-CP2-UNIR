- name: Create MongoDB deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
              name: mongodb-cp2-unir
              namespace: my-aks-unir
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mongodb-unir
        template:
          metadata:
            labels:
              app: mongodb-unir
          spec:
            containers:
              - name: mongodb-container-unir
                image: "{{ acr_login_server }}/casopractico2/mongodb:latest"
                command: ["mongod", "--noauth", "--bind_ip_all"]
                ports:
                  - containerPort: 27017
                env:
                  - name: MONGO_INITDB_ROOT_USERNAME
                    value: "admin"
                  - name: MONGO_INITDB_ROOT_PASSWORD
                    value: "password"
                  # - name: MONGO_INITDB_DATABASE
                  #   value: "todo-list"
                volumeMounts:
                  - name: mongodb-storage-unir
                    mountPath: /data/db
            volumes:
              - name: mongodb-storage-unir
                persistentVolumeClaim:
                  claimName: my-pvc-cp2