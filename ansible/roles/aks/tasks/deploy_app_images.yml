- name: Deploy frontend application
  kubernetes.core.k8s:
    state: present
    kubeconfig: /root/.kube/config
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend-deployment
        namespace: my-aks-unir
        annotations:
          redeploy-timestamp: "{{ ansible_date_time.iso8601 }}"  # Ajoute un timestamp unique
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: my-todo-web
        template:
          metadata:
            labels:
              app: my-todo-web
          spec:
            containers:
              - name: frontend-container
                # image: "{{ web_image_tag }}"
                image: "{{ acr_login_server }}/casopractico2/my-todo-web:{{ formatted_timestamp }}"
                imagePullPolicy: Always
                ports:
                  - containerPort: 80
                env:
                  # - name: REACT_APP_API_BASE_URL
                  #   valueFrom:
                  #     configMapKeyRef:
                  #       name: frontend-config
                  #       key: REACT_APP_API_BASE_URL
                  - name: REACT_APP_BACKEND_SERVICE_URL_PROD
                    value: "http://backend-service.my-aks-unir.svc.cluster.local:8080/api/v1"
                    # value: "http://backend-service:8080/api/v1"

- name: Deploy backend application
  kubernetes.core.k8s:
    state: present
    kubeconfig: /root/.kube/config
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-deployment
        namespace: my-aks-unir
        annotations:
          redeploy-timestamp: "{{ ansible_date_time.iso8601 }}"  # Ajoute un timestamp unique
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: my-todo-api
        template:
          metadata:
            labels:
              app: my-todo-api
          spec:
            containers:
              - name: backend-container
                image: "{{ acr_login_server }}/casopractico2/my-todo-api:{{ formatted_timestamp }}"
                imagePullPolicy: Always
                # image: "{{ api_image_tag }}"
                ports:
                  - containerPort: 8080
                # env:
                #   - name: PORT
                #     valueFrom:
                #       configMapKeyRef:
                #         name: backend-config
                #         key: PORT
                #   - name: APP_BASE_URL
                #     valueFrom:
                #       configMapKeyRef:
                #         name: backend-config
                #         key: APP_BASE_URL
                #   - name: MONGO_DB
                #     valueFrom:
                #       secretKeyRef:
                #         name: mongodb-secret-unir
                #         key: MONGO_DB
                env:
                  - name: PORT
                    value: "8080"
                  - name: APP_BASE_URL
                    value: "/api/v1/"
                  - name: MONGO_DB
                    value: "mongodb://mongodb-service-unir:27017/todo-app"
                  
                  # - name: MONGO_DB
                  #   value: "mongodb://admin:admin123@mongodb-service-unir:27017/todo-app?authSource=admin"
                    # value: "mongodb://admin:password@mongodb-service-unir:27017/todo-app?authSource=admin"
                    # mongodb://admin:password@mongodb-service.namespace.svc.cluster.local:27017/mydatabase

                  - name: ADMIN_NAME
                    value: "admin"
                  - name: ADMIN_PASSWORD
                    value: "admin123"

                # env :
                #   - name: PORT
                #     value: "8080"
                #   - name: APP_BASE_URL
                #     value: "/api/v1/"
                #   - name: MONGO_DB
                #     value: "mongodb://admin:ced123@mongodb-service-unir:27017/todo-app"
