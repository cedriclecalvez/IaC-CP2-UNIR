- name: Expose API application internally
  kubernetes.core.k8s:
    state: present
    kubeconfig: /root/.kube/config
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: backend-service
        namespace: my-aks-unir
      spec:
        selector:
          app: my-todo-api
        ports:
          - protocol: TCP
            port: 8080
            targetPort: 8080
        type: ClusterIP