- name: Create MongoDB service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mongodb-service-unir
        namespace: my-aks-unir
      spec:
        ports:
          - port: 27017
        selector:
          app: mongodb-unir
        type: ClusterIP # for internal access only
